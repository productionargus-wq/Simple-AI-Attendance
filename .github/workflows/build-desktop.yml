name: Build Desktop Apps (Windows EXE & macOS DMG)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Desktop platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - macos

jobs:
  build-windows:
    name: Build Windows Desktop (EXE & Setup Installer)
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Create default environment file
        run: |
          New-Item -Path .env -ItemType File -Value "FLASK_ENV=production`nPORT=5000" -Force

      - name: Install Inno Setup Compiler
        run: |
          choco install innosetup --no-progress

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pywebview waitress pyinstaller pythonnet

      - name: Compile Standalone Windows Executable (.exe)
        run: |
          pyinstaller --noconfirm ArgusAttendance.spec

      - name: Compile Windows Setup Wizard Installer (.exe)
        run: |
          $isccCmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($isccCmd) {
            & $isccCmd.Source installer.iss
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files\Inno Setup 6\ISCC.exe" installer.iss
          } else {
            Write-Warning "ISCC.exe not found at standard path, looking for iscc in PATH..."
            iscc installer.iss
          }

      - name: Upload Windows Executables
        uses: actions/upload-artifact@v4
        with:
          name: Argus-Attendance-Windows-Desktop
          path: |
            dist/ArgusAttendance.exe
            dist/ArgusAttendance_Setup_v2.0.exe

  build-macos:
    name: Build macOS Desktop (DMG & App Bundle)
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Create default environment file
        run: |
          echo "FLASK_ENV=production" > .env
          echo "PORT=5000" >> .env

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pywebview waitress pyinstaller

      - name: Compile macOS Application (.app)
        run: |
          pyinstaller --noconfirm ArgusAttendance.spec

      - name: Package macOS DMG Installer & ZIP
        run: |
          cd dist
          hdiutil create -volname "Argus Attendance" -srcfolder "ArgusAttendance.app" -ov -format UDZO "ArgusAttendance-macOS.dmg"
          zip -r "ArgusAttendance-macOS.zip" "ArgusAttendance.app"

      - name: Upload macOS Installers
        uses: actions/upload-artifact@v4
        with:
          name: Argus-Attendance-macOS-Desktop
          path: |
            dist/ArgusAttendance-macOS.dmg
            dist/ArgusAttendance-macOS.zip

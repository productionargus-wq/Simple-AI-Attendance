{% extends 'base.html' %}

{% block content %}
<!-- Top Banner Card Matching Image 1 -->
<div class="content-banner-card">
  <div class="content-banner-title">ADVANCE MANAGEMENT</div>
  <a href="/payment-entry" class="btn-yellow-action">
    ← Back to Payment
  </a>
</div>

<!-- Advance Inline Form Matching Image 1 -->
<div class="advance-form-container">
  <div class="advance-form-row">
    <div class="advance-field-group">
      <label for="advEmployee" class="advance-field-label">Employee</label>
      <select id="advEmployee" class="advance-field-input" style="min-width: 170px;">
        {% for emp in employees %}
        <option value="{{ emp }}" {% if loop.first or emp == 'G_sujithkumar' %}selected{% endif %}>{{ emp }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="advance-field-group">
      <label for="advDate" class="advance-field-label">Date</label>
      <input type="date" id="advDate" class="advance-field-input" placeholder="mm/dd/yyyy">
    </div>

    <div class="advance-field-group">
      <label for="advAmount" class="advance-field-label">Amount</label>
      <input type="number" step="0.01" id="advAmount" class="advance-field-input" style="width: 150px;" value="500">
    </div>

    <div class="advance-field-group">
      <button type="button" id="btnSaveAdvance" class="btn-save-advance-std">
        Save Advance
      </button>
    </div>
  </div>
</div>

<!-- Advance Table Card Matching Image 1 -->
<div class="table-card">
  <div class="table-toolbar">
    <div class="table-toolbar-left">
      <div class="entries-select-wrapper">
        <span>Show</span>
        <select id="advanceEntriesLimit" class="entries-select">
          <option value="10" selected>10</option>
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
        <span>entries</span>
      </div>

      <div class="export-btn-group">
        <button class="btn-export btn-excel" id="btnAdvanceExcel" title="Excel">Excel</button>
        <button class="btn-export btn-pdf" id="btnAdvancePdf" title="PDF">PDF</button>
        <button class="btn-export" id="btnAdvancePrint" title="Print">Print</button>
      </div>
    </div>

    <div class="search-box-wrapper">
      <label for="advanceSearch">Search:</label>
      <input type="text" id="advanceSearch" class="search-input">
    </div>
  </div>

  <div class="table-responsive" id="printableAdvanceSection">
    <table class="employee-table" id="advanceTable">
      <thead>
        <tr>
          <th data-col="timestamp" style="width: 25%;">Timestamp <span class="sort-icon">⇅</span></th>
          <th data-col="employee_name" style="width: 25%;">Employee <span class="sort-icon">⇅</span></th>
          <th data-col="advance_date" style="width: 20%;">Date <span class="sort-icon">⇅</span></th>
          <th data-col="amount" style="width: 15%;">Amount <span class="sort-icon">⇅</span></th>
          <th style="width: 15%;">Action <span class="sort-icon">⇅</span></th>
        </tr>
      </thead>
      <tbody id="advanceTableBody">
        <tr>
          <td colspan="5" class="table-empty-message">No data available in table</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="table-footer">
    <div id="advanceTableInfo">Showing 0 to 0 of 0 entries</div>
    <div class="pagination-controls">
      <button class="pagination-btn disabled" id="prevAdvancePageBtn">Previous</button>
      <button class="pagination-btn disabled" id="nextAdvancePageBtn">Next</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function () {
  let advancePage = 1;
  let advanceLimit = 10;
  let advanceTotal = 0;

  const todayStr = new Date().toISOString().split('T')[0];
  const advDateInput = document.getElementById('advDate');
  if (advDateInput) advDateInput.value = todayStr;

  const btnSaveAdvance = document.getElementById('btnSaveAdvance');
  btnSaveAdvance.addEventListener('click', function () {
    const emp = document.getElementById('advEmployee').value;
    const dateVal = document.getElementById('advDate').value;
    const amountVal = document.getElementById('advAmount').value;

    if (!emp) {
      alert('Please select an employee.');
      return;
    }
    if (!amountVal || isNaN(parseFloat(amountVal)) || parseFloat(amountVal) <= 0) {
      alert('Please enter a valid advance amount.');
      return;
    }

    fetch('/api/advances', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        employee_name: emp,
        advance_date: dateVal,
        amount: parseFloat(amountVal)
      })
    })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          loadAdvances();
        } else {
          alert(data.error || 'Failed to save advance.');
        }
      })
      .catch(err => {
        console.error('Error saving advance:', err);
        alert('Network error while saving advance.');
      });
  });

  function loadAdvances() {
    const search = document.getElementById('advanceSearch').value.trim();
    const params = new URLSearchParams({
      search: search,
      page: advancePage,
      limit: advanceLimit
    });

    fetch(`/api/advances?${params.toString()}`)
      .then(res => res.json())
      .then(res => {
        renderAdvanceTable(res);
      })
      .catch(err => console.error('Error fetching advances:', err));
  }

  function renderAdvanceTable(res) {
    const tbody = document.getElementById('advanceTableBody');
    const infoText = document.getElementById('advanceTableInfo');
    const prevBtn = document.getElementById('prevAdvancePageBtn');
    const nextBtn = document.getElementById('nextAdvancePageBtn');

    advanceTotal = res.total;
    const data = res.data;

    if (!data || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="table-empty-message">No data available in table</td></tr>';
      infoText.innerText = 'Showing 0 to 0 of 0 entries';
      prevBtn.classList.add('disabled');
      nextBtn.classList.add('disabled');
      return;
    }

    const startIdx = (advancePage - 1) * advanceLimit + 1;
    const endIdx = Math.min(advancePage * advanceLimit, advanceTotal);
    infoText.innerText = `Showing ${startIdx} to ${endIdx} of ${advanceTotal} entries`;

    if (advancePage <= 1) {
      prevBtn.classList.add('disabled');
    } else {
      prevBtn.classList.remove('disabled');
    }

    if (endIdx >= advanceTotal) {
      nextBtn.classList.add('disabled');
    } else {
      nextBtn.classList.remove('disabled');
    }

    let rowsHtml = '';
    data.forEach(r => {
      rowsHtml += `
        <tr>
          <td>${r.timestamp}</td>
          <td style="font-weight: 600;">${r.employee_name}</td>
          <td>${r.advance_date}</td>
          <td style="color: #0d6efd; font-weight: 700;">₹ ${parseFloat(r.amount).toFixed(2)}</td>
          <td>
            <button class="btn-action-manual-del btn-del-advance" data-id="${r.id}" title="Delete">Del</button>
          </td>
        </tr>
      `;
    });

    tbody.innerHTML = rowsHtml;

    document.querySelectorAll('.btn-del-advance').forEach(btn => {
      btn.addEventListener('click', function () {
        const id = this.getAttribute('data-id');
        deleteAdvance(id);
      });
    });
  }

  function deleteAdvance(id) {
    if (!confirm('Are you sure you want to delete this advance record?')) return;
    fetch(`/api/advances/${id}`, { method: 'DELETE' })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          loadAdvances();
        } else {
          alert('Failed to delete advance.');
        }
      })
      .catch(err => console.error(err));
  }

  const advanceSearch = document.getElementById('advanceSearch');
  let advanceSearchTimer = null;
  advanceSearch.addEventListener('input', function () {
    clearTimeout(advanceSearchTimer);
    advanceSearchTimer = setTimeout(() => {
      advancePage = 1;
      loadAdvances();
    }, 300);
  });

  document.getElementById('advanceEntriesLimit').addEventListener('change', function () {
    advanceLimit = parseInt(this.value);
    advancePage = 1;
    loadAdvances();
  });

  document.getElementById('prevAdvancePageBtn').addEventListener('click', function () {
    if (advancePage > 1) {
      advancePage--;
      loadAdvances();
    }
  });

  document.getElementById('nextAdvancePageBtn').addEventListener('click', function () {
    if (advancePage * advanceLimit < advanceTotal) {
      advancePage++;
      loadAdvances();
    }
  });

  document.getElementById('btnAdvanceExcel').addEventListener('click', function () {
    window.location.href = `/api/advances/export/excel`;
  });

  document.getElementById('btnAdvancePdf').addEventListener('click', function () {
    window.location.href = `/api/advances/export/pdf`;
  });

  document.getElementById('btnAdvancePrint').addEventListener('click', function () {
    window.print();
  });

  loadAdvances();
});
</script>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARGUS TECHNOLOGIES - Employee Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background-color: #3d6078; margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden;">

  <div style="background-color: #ffffff; border-radius: 10px; padding: 40px 36px; width: 350px; box-shadow: 0 8px 30px rgba(0,0,0,0.25); text-align: center; box-sizing: border-box;">
    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Argus" style="max-width: 90px; margin-bottom: 8px;">
    <div style="font-size: 16px; font-weight: 800; color: #2c3e50; letter-spacing: 0.5px; margin-bottom: 4px;">ARGUS TECHNOLOGIES</div>
    <div style="font-size: 12px; color: #ffd166; font-weight: 800; letter-spacing: 1px; margin-bottom: 22px;">EMPLOYEE LOGIN</div>

    {% if error %}
    <div style="background-color: #f8d7da; color: #842029; border: 1px solid #f5c2c7; border-radius: 4px; padding: 10px 12px; font-size: 12px; line-height: 1.4; margin-bottom: 18px; text-align: left;">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/employee-login">
      <div style="margin-bottom: 20px; text-align: left;">
        <label style="font-size: 12px; font-weight: 700; color: #333333; display: block; margin-bottom: 6px;">Registered Email ID</label>
        <input type="email" name="email" required placeholder="e.g. employee@company.com" style="width: 100%; padding: 10px 12px; border: 1px solid #ced4da; border-radius: 4px; font-size: 13px; outline: none; box-sizing: border-box;">
        <div style="font-size: 11px; color: #6c757d; margin-top: 4px;">Enter the email provided during employee enrollment.</div>
      </div>
      <button type="submit" style="width: 100%; background-color: #198754; color: #ffffff; border: none; border-radius: 4px; padding: 11px; font-size: 13px; font-weight: 700; cursor: pointer; letter-spacing: 0.8px; transition: background 0.2s;">
        ACCESS EMPLOYEE PORTAL
      </button>
    </form>

    <!-- Visual Divider -->
    <div style="display: flex; align-items: center; margin: 18px 0; color: #888;">
      <div style="flex: 1; height: 1px; background: #e0e0e0;"></div>
      <span style="padding: 0 10px; font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase;">or</span>
      <div style="flex: 1; height: 1px; background: #e0e0e0;"></div>
    </div>

    <!-- Continue with Google Button -->
    <a href="/auth/google/login?type=employee" style="display: flex; align-items: center; justify-content: center; width: 100%; background-color: #ffffff; color: #3c4043; border: 1px solid #dadce0; border-radius: 4px; padding: 10px; font-size: 13px; font-weight: 600; text-decoration: none; box-sizing: border-box; transition: background-color 0.2s, box-shadow 0.2s; box-shadow: 0 1px 2px rgba(60,64,67,0.1);">
      <svg width="18" height="18" viewBox="0 0 18 18" style="margin-right: 10px; flex-shrink: 0;">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
        <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.347 2.825.957 4.039l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
      </svg>
      <span>Continue with Google</span>
    </a>

    <div style="margin-top: 20px; font-size: 12px;">
      <a href="/" style="color: #6c757d; text-decoration: none; font-weight: 600;">← Back to Attendance</a>
    </div>
  </div>

</body>
</html>

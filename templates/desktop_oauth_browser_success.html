<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Sign-In Successful - ARGUS TECHNOLOGIES</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #0f172a;
    }
    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 40px 36px;
      max-width: 440px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      border: 1px solid #e2e8f0;
    }
    .icon-wrap {
      width: 64px;
      height: 64px;
      background: #ecfdf5;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .icon-wrap svg {
      width: 34px;
      height: 34px;
      stroke: #10b981;
    }
    h2 {
      margin: 0 0 10px;
      font-size: 22px;
      color: #0d3257;
      font-weight: 700;
    }
    p {
      margin: 0 0 20px;
      font-size: 14px;
      color: #64748b;
      line-height: 1.6;
    }
    .hint {
      display: inline-block;
      background: #f1f5f9;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      color: #475569;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
    </div>
    <h2>Sign-In Successful!</h2>
    <p>Your Google account has been authenticated. You can safely close this browser window and return to the <b>Argus Attendance Desktop Application</b>.</p>
    <div class="hint">
      You are now signed in as {{ email }}
    </div>
  </div>

  <script>
    // Attempt automatic window close after 4 seconds
    setTimeout(function() {
      try {
        window.close();
      } catch (e) {}
    }, 4000);
  </script>
</body>
</html>

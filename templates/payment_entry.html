{% extends 'base.html' %}

{% block content %}
<!-- Top Banner Card Matching Image 1 -->
<div class="content-banner-card">
  <div class="content-banner-title">PAYMENT MANAGEMENT</div>
  <div class="payment-banner-actions">
    <button class="btn-yellow-action" id="btnOpenAddPaymentModal">
      <i class="fa fa-plus"></i> + Add Payment
    </button>
    <a href="/advance-management" class="btn-yellow-action">
      <i class="fa fa-plus"></i> + Add Advance
    </a>
    <a href="/balance-report" class="btn-yellow-action">
      📊 Balance
    </a>
  </div>
</div>

<!-- Payment Table Card -->
<div class="table-card">
  <div class="table-toolbar">
    <div class="table-toolbar-left">
      <div class="entries-select-wrapper">
        <span>Show</span>
        <select id="paymentEntriesLimit" class="entries-select">
          <option value="10" selected>10</option>
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
        <span>entries</span>
      </div>

      <div class="export-btn-group">
        <button class="btn-export btn-excel" id="btnPaymentExcel" title="Excel">Excel</button>
        <button class="btn-export btn-pdf" id="btnPaymentPdf" title="PDF">PDF</button>
        <button class="btn-export" id="btnPaymentPrint" title="Print">Print</button>
      </div>
    </div>

    <div class="search-box-wrapper">
      <label for="paymentSearch">Search:</label>
      <input type="text" id="paymentSearch" class="search-input">
    </div>
  </div>

  <div class="table-responsive" id="printablePaymentSection">
    <table class="employee-table" id="paymentTable">
      <thead>
        <tr>
          <th data-col="timestamp" style="min-width: 140px;">Timestamp <span class="sort-icon">⇅</span></th>
          <th data-col="employee_name" style="min-width: 130px;">Employee <span class="sort-icon">⇅</span></th>
          <th data-col="payment_date" style="min-width: 130px;">Date <span class="sort-icon">⇅</span></th>
          <th data-col="amount" style="min-width: 90px;">Amount <span class="sort-icon">⇅</span></th>
          <th data-col="bank" style="min-width: 90px;">Bank <span class="sort-icon">⇅</span></th>
          <th data-col="payment_type" style="min-width: 110px;">Payment Type <span class="sort-icon">⇅</span></th>
          <th data-col="reason" style="min-width: 130px;">Reason <span class="sort-icon">⇅</span></th>
          <th data-col="receipt_filename" style="min-width: 80px;">Receipt <span class="sort-icon">⇅</span></th>
          <th style="min-width: 80px;">Action <span class="sort-icon">⇅</span></th>
        </tr>
        <!-- Table Filters Row Matching Reference UI -->
        <tr class="table-filters-row">
          <th></th>
          <th>
            <select id="filterPaymentEmployee" class="table-filter-select">
              <option value="All" selected>All</option>
              {% for emp in employees %}
              <option value="{{ emp }}">{{ emp }}</option>
              {% endfor %}
            </select>
          </th>
          <th>
            <div class="table-date-stacked">
              <input type="date" id="filterPaymentStartDate" class="table-filter-date" placeholder="mm/dd/yyyy">
              <input type="date" id="filterPaymentEndDate" class="table-filter-date" placeholder="mm/dd/yyyy">
            </div>
          </th>
          <th></th>
          <th>
            <select id="filterPaymentBank" class="table-filter-select">
              <option value="All" selected>All</option>
              <option value="HDFC">HDFC</option>
              <option value="SBI">SBI</option>
              <option value="ICICI">ICICI</option>
              <option value="Axis">Axis</option>
              <option value="Cash">Cash</option>
              <option value="Others">Others</option>
            </select>
          </th>
          <th>
            <select id="filterPaymentType" class="table-filter-select">
              <option value="All" selected>All</option>
              <option value="UPI">UPI</option>
              <option value="Cash">Cash</option>
              <option value="Net Banking">Net Banking</option>
              <option value="Mobile Banking">Mobile Banking</option>
              <option value="Repayment">Repayment</option>
              <option value="Others">Others</option>
            </select>
          </th>
          <th>
            <select id="filterPaymentReason" class="table-filter-select">
              <option value="All" selected>All</option>
              <option value="Advance Repayment">Advance Repayment</option>
              <option value="Salary">Salary</option>
              <option value="Incentive">Incentive</option>
              <option value="Allowance">Allowance</option>
              <option value="Other Earnings">Other Earnings</option>
              <option value="Other Deductions">Other Deductions</option>
            </select>
          </th>
          <th></th>
          <th></th>
        </tr>
      </thead>
      <tbody id="paymentTableBody">
        <tr>
          <td colspan="9" class="table-empty-message">No data available in table</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="table-footer">
    <div id="paymentTableInfo">Showing 0 to 0 of 0 entries</div>
    <div class="pagination-controls">
      <button class="pagination-btn disabled" id="prevPaymentPageBtn">Previous</button>
      <button class="pagination-btn disabled" id="nextPaymentPageBtn">Next</button>
    </div>
  </div>
</div>

<!-- ================= ADD PAYMENT MODAL (IMAGES 2, 3, 4) ================= -->
<div class="modal-overlay" id="paymentModalOverlay">
  <div class="modal-box-payment">
    <!-- Top-left Close 'x' Icon matching Screenshot -->
    <button type="button" class="modal-close-icon-corner" id="btnClosePaymentModal" title="Close">x</button>
    
    <form id="paymentForm" enctype="multipart/form-data">
      <input type="hidden" id="editPaymentId" value="">
      
      <div class="payment-form-grid">
        <!-- Row 1: Employee -->
        <label for="paymentEmployee" class="payment-form-label">Employee</label>
        <select id="paymentEmployee" name="employee_name" class="payment-form-control">
          {% for emp in employees %}
          <option value="{{ emp }}" {% if loop.first or emp == 'G_sujithkumar' %}selected{% endif %}>{{ emp }}</option>
          {% endfor %}
        </select>

        <!-- Row 2: Date -->
        <label for="paymentDate" class="payment-form-label">Date</label>
        <input type="date" id="paymentDate" name="payment_date" class="payment-form-control" placeholder="mm/dd/yyyy">

        <!-- Row 3: Amount -->
        <label for="paymentAmount" class="payment-form-label">Amount</label>
        <input type="number" step="0.01" id="paymentAmount" name="amount" class="payment-form-control" placeholder="">

        <!-- Row 4: Bank -->
        <label for="paymentBank" class="payment-form-label">Bank</label>
        <input type="text" id="paymentBank" name="bank" class="payment-form-control" placeholder="">

        <!-- Row 5: Payment Type (Options from Image 3) -->
        <label for="paymentType" class="payment-form-label">Payment Type</label>
        <select id="paymentType" name="payment_type" class="payment-form-control">
          <option value="UPI" selected>UPI</option>
          <option value="Cash">Cash</option>
          <option value="Net Banking">Net Banking</option>
          <option value="Mobile Banking">Mobile Banking</option>
          <option value="Repayment">Repayment</option>
          <option value="Others">Others</option>
        </select>

        <!-- Row 6: Reason (Options from Image 4) -->
        <label for="paymentReason" class="payment-form-label">Reason</label>
        <select id="paymentReason" name="reason" class="payment-form-control">
          <option value="Advance Repayment" selected>Advance Repayment</option>
          <option value="Salary">Salary</option>
          <option value="Incentive">Incentive</option>
          <option value="Allowance">Allowance</option>
          <option value="Other Earnings">Other Earnings</option>
          <option value="Other Deductions">Other Deductions</option>
        </select>

        <!-- Row 7: Receipt -->
        <label for="paymentReceipt" class="payment-form-label">Receipt</label>
        <input type="file" id="paymentReceipt" name="receipt" class="payment-form-file" accept="image/*,.pdf,.doc,.docx,.txt">
      </div>

      <!-- Save Button matching Screenshot -->
      <div class="payment-modal-footer">
        <button type="submit" id="btnSavePayment" class="btn-std-save">Save</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function () {
  let paymentPage = 1;
  let paymentLimit = 10;
  let paymentTotal = 0;

  const todayStr = new Date().toISOString().split('T')[0];
  const paymentDateInput = document.getElementById('paymentDate');
  if (paymentDateInput) paymentDateInput.value = todayStr;

  const paymentModalOverlay = document.getElementById('paymentModalOverlay');
  const btnOpenAddPaymentModal = document.getElementById('btnOpenAddPaymentModal');
  const btnClosePaymentModal = document.getElementById('btnClosePaymentModal');
  const paymentForm = document.getElementById('paymentForm');

  btnOpenAddPaymentModal.addEventListener('click', function () {
    document.getElementById('editPaymentId').value = '';
    paymentForm.reset();
    if (paymentDateInput) paymentDateInput.value = todayStr;
    paymentModalOverlay.classList.add('active');
  });

  btnClosePaymentModal.addEventListener('click', function () {
    paymentModalOverlay.classList.remove('active');
  });

  paymentModalOverlay.addEventListener('click', function (e) {
    if (e.target === paymentModalOverlay) {
      paymentModalOverlay.classList.remove('active');
    }
  });

  paymentForm.addEventListener('submit', function (e) {
    e.preventDefault();
    const editId = document.getElementById('editPaymentId').value;
    const formData = new FormData(paymentForm);

    const empName = document.getElementById('paymentEmployee').value;
    const amountVal = document.getElementById('paymentAmount').value;
    if (!empName) {
      alert('Please select an employee.');
      return;
    }
    if (!amountVal || isNaN(parseFloat(amountVal)) || parseFloat(amountVal) <= 0) {
      alert('Please enter a valid amount.');
      return;
    }

    const url = editId ? `/api/payments/${editId}` : '/api/payments';
    fetch(url, {
      method: 'POST',
      body: formData
    })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          paymentModalOverlay.classList.remove('active');
          paymentForm.reset();
          loadPayments();
        } else {
          alert(data.error || 'Failed to save payment.');
        }
      })
      .catch(err => {
        console.error('Error saving payment:', err);
        alert('Network error while saving payment.');
      });
  });

  function loadPayments() {
    const employee = document.getElementById('filterPaymentEmployee').value;
    const startDate = document.getElementById('filterPaymentStartDate').value;
    const endDate = document.getElementById('filterPaymentEndDate').value;
    const bank = document.getElementById('filterPaymentBank').value;
    const paymentType = document.getElementById('filterPaymentType').value;
    const reason = document.getElementById('filterPaymentReason').value;
    const search = document.getElementById('paymentSearch').value.trim();

    const params = new URLSearchParams({
      employee: employee,
      start_date: startDate,
      end_date: endDate,
      bank: bank,
      payment_type: paymentType,
      reason: reason,
      search: search,
      page: paymentPage,
      limit: paymentLimit
    });

    fetch(`/api/payments?${params.toString()}`)
      .then(res => res.json())
      .then(res => {
        renderPaymentTable(res);
      })
      .catch(err => console.error('Error fetching payments:', err));
  }

  function renderPaymentTable(res) {
    const tbody = document.getElementById('paymentTableBody');
    const infoText = document.getElementById('paymentTableInfo');
    const prevBtn = document.getElementById('prevPaymentPageBtn');
    const nextBtn = document.getElementById('nextPaymentPageBtn');

    paymentTotal = res.total;
    const data = res.data;

    if (!data || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="9" class="table-empty-message">No data available in table</td></tr>';
      infoText.innerText = 'Showing 0 to 0 of 0 entries';
      prevBtn.classList.add('disabled');
      nextBtn.classList.add('disabled');
      return;
    }

    const startIdx = (paymentPage - 1) * paymentLimit + 1;
    const endIdx = Math.min(paymentPage * paymentLimit, paymentTotal);
    infoText.innerText = `Showing ${startIdx} to ${endIdx} of ${paymentTotal} entries`;

    if (paymentPage <= 1) {
      prevBtn.classList.add('disabled');
    } else {
      prevBtn.classList.remove('disabled');
    }

    if (endIdx >= paymentTotal) {
      nextBtn.classList.add('disabled');
    } else {
      nextBtn.classList.remove('disabled');
    }

    let rowsHtml = '';
    data.forEach(r => {
      let receiptHtml = '-';
      if (r.receipt_filename) {
        receiptHtml = `<a href="/static/uploads/receipts/${r.receipt_filename}" target="_blank" style="color: #0d6efd; font-size: 11px; text-decoration: underline;">View</a>`;
      }

      rowsHtml += `
        <tr>
          <td>${r.timestamp}</td>
          <td style="font-weight: 600;">${r.employee_name}</td>
          <td>${r.payment_date}</td>
          <td style="color: #0d6efd; font-weight: 700;">₹ ${parseFloat(r.amount).toFixed(2)}</td>
          <td>${r.bank || '-'}</td>
          <td>${r.payment_type}</td>
          <td>${r.reason}</td>
          <td>${receiptHtml}</td>
          <td>
            <button class="btn-action-manual-edit btn-edit-payment" data-id="${r.id}" title="Edit">Edit</button>
            <button class="btn-action-manual-del btn-del-payment" data-id="${r.id}" title="Delete">Del</button>
          </td>
        </tr>
      `;
    });

    tbody.innerHTML = rowsHtml;

    document.querySelectorAll('.btn-edit-payment').forEach(btn => {
      btn.addEventListener('click', function () {
        const id = this.getAttribute('data-id');
        editPayment(id);
      });
    });

    document.querySelectorAll('.btn-del-payment').forEach(btn => {
      btn.addEventListener('click', function () {
        const id = this.getAttribute('data-id');
        deletePayment(id);
      });
    });
  }

  function editPayment(id) {
    fetch(`/api/payments/${id}`)
      .then(res => res.json())
      .then(p => {
        document.getElementById('editPaymentId').value = p.id;
        document.getElementById('paymentEmployee').value = p.employee_name;
        document.getElementById('paymentDate').value = p.payment_date;
        document.getElementById('paymentAmount').value = p.amount;
        document.getElementById('paymentBank').value = p.bank;
        document.getElementById('paymentType').value = p.payment_type;
        document.getElementById('paymentReason').value = p.reason;
        paymentModalOverlay.classList.add('active');
      })
      .catch(err => console.error(err));
  }

  function deletePayment(id) {
    if (!confirm('Are you sure you want to delete this payment record?')) return;
    fetch(`/api/payments/${id}`, { method: 'DELETE' })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          loadPayments();
        } else {
          alert('Failed to delete payment.');
        }
      })
      .catch(err => console.error(err));
  }

  ['filterPaymentEmployee', 'filterPaymentStartDate', 'filterPaymentEndDate', 'filterPaymentBank', 'filterPaymentType', 'filterPaymentReason'].forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener('change', function () {
        paymentPage = 1;
        loadPayments();
      });
    }
  });

  const paymentSearch = document.getElementById('paymentSearch');
  let paymentSearchTimer = null;
  paymentSearch.addEventListener('input', function () {
    clearTimeout(paymentSearchTimer);
    paymentSearchTimer = setTimeout(() => {
      paymentPage = 1;
      loadPayments();
    }, 300);
  });

  document.getElementById('paymentEntriesLimit').addEventListener('change', function () {
    paymentLimit = parseInt(this.value);
    paymentPage = 1;
    loadPayments();
  });

  document.getElementById('prevPaymentPageBtn').addEventListener('click', function () {
    if (paymentPage > 1) {
      paymentPage--;
      loadPayments();
    }
  });

  document.getElementById('nextPaymentPageBtn').addEventListener('click', function () {
    if (paymentPage * paymentLimit < paymentTotal) {
      paymentPage++;
      loadPayments();
    }
  });

  document.getElementById('btnPaymentExcel').addEventListener('click', function () {
    const employee = document.getElementById('filterPaymentEmployee').value;
    const startDate = document.getElementById('filterPaymentStartDate').value;
    const endDate = document.getElementById('filterPaymentEndDate').value;
    const bank = document.getElementById('filterPaymentBank').value;
    const paymentType = document.getElementById('filterPaymentType').value;
    const reason = document.getElementById('filterPaymentReason').value;
    window.location.href = `/api/payments/export/excel?employee=${encodeURIComponent(employee)}&start_date=${encodeURIComponent(startDate)}&end_date=${encodeURIComponent(endDate)}&bank=${encodeURIComponent(bank)}&payment_type=${encodeURIComponent(paymentType)}&reason=${encodeURIComponent(reason)}`;
  });

  document.getElementById('btnPaymentPdf').addEventListener('click', function () {
    const employee = document.getElementById('filterPaymentEmployee').value;
    const startDate = document.getElementById('filterPaymentStartDate').value;
    const endDate = document.getElementById('filterPaymentEndDate').value;
    const bank = document.getElementById('filterPaymentBank').value;
    const paymentType = document.getElementById('filterPaymentType').value;
    const reason = document.getElementById('filterPaymentReason').value;
    window.location.href = `/api/payments/export/pdf?employee=${encodeURIComponent(employee)}&start_date=${encodeURIComponent(startDate)}&end_date=${encodeURIComponent(endDate)}&bank=${encodeURIComponent(bank)}&payment_type=${encodeURIComponent(paymentType)}&reason=${encodeURIComponent(reason)}`;
  });

  document.getElementById('btnPaymentPrint').addEventListener('click', function () {
    const printContents = document.getElementById('printablePaymentSection').innerHTML;
    const printWindow = window.open('', '', 'height=600,width=850');
    printWindow.document.write('<html><head><title>Print Payment Entries</title>');
    printWindow.document.write('<style>');
    printWindow.document.write(`
      body { font-family: sans-serif; padding: 20px; }
      h2 { text-align: center; margin-bottom: 20px; font-size: 18px; }
      table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 11px; }
      th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; }
      th { background: #2c3e50; color: #fff; }
      .table-filters-row { display: none; }
      th:last-child, td:last-child { display: none; }
    `);
    printWindow.document.write('</style></head><body>');
    const compName = document.querySelector('.nav-title')?.innerText?.trim() || 'ARGUS TECHNOLOGIES';
    printWindow.document.write(`<h2>${compName} - PAYMENT MANAGEMENT REPORT</h2>`);
    printWindow.document.write(printContents);
    printWindow.document.write('</body></html>');
    printWindow.document.close();
    printWindow.focus();
    setTimeout(() => {
      printWindow.print();
      printWindow.close();
    }, 250);
  });

  // Initial load
  loadPayments();
});
</script>
{% endblock %}
